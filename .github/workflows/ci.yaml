name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # TODO (candidates): Add the following security scanning jobs.
  # Tool selection is your decision — document your choices in findings.md.
  #
  # sast:
  #   Static Application Security Testing against app/ source code
  #   Upload JSON report as a build artifact named sast.<tool>.json
  #   Build should fail on critical findings
  #
  # sca:
  #   Dependency / Software Composition Analysis against requirements.txt
  #   Upload JSON report as a build artifact named sca.<tool>.json
  #   Build should fail on critical or high severity CVEs
  #
  # container-scan:
  #   Build the Docker image, then scan it for vulnerabilities and misconfigurations
  #   Upload JSON report as a build artifact named container.<tool>.json
  #
  # iac-scan:
  #   Scan the Helm chart or Terraform configuration for security misconfigurations
  #   Upload JSON report as a build artifact named iac.<tool>.json


  security-scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SAST and SCA tools
        run: pip install bandit==1.8.3 pip-audit==2.8.0
      - name: Run Bandit SAST
        continue-on-error: true
        run: bandit -r app -f json -o reports/sast.bandit.json
      - name: Run pip-audit SCA
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output reports/sca.pip-audit.json
      - name: Build API image
        run: docker build -t vulntracker:${{ github.sha }} .
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vulntracker:${{ github.sha }}
          format: json
          output: reports/container.trivy.json
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "0"
      - name: Install Checkov
        run: pip install checkov==3.2.390
      - name: Run Checkov IaC scan
        continue-on-error: true
        run: checkov -d helm/vulntracker -o json --output-file-path reports --output-file-name iac.checkov.json
      - name: Upload raw scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: reports/*.json
          if-no-files-found: warn
