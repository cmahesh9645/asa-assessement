replicaCount: 2
image:
  repository: vulntracker
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 8000
ingress:
  enabled: false
  className: nginx
  host: vulntracker.example.com
  tlsSecret: vulntracker-tls
externalSecret:
  enabled: true
  secretStoreName: azure-keyvault
  refreshInterval: 1h
  keyVaultSecretNames:
    secretKey: vulntracker-secret-key
    databaseUrl: vulntracker-database-url
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
